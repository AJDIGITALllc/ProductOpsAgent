name: Secret Hygiene Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for .env files
        run: |
          echo "Checking for .env files in repository..."
          if find . -name ".env" -o -name ".env.*" ! -name ".env.example" | grep -q .; then
            echo "❌ ERROR: .env files found in repository!"
            find . -name ".env" -o -name ".env.*" ! -name ".env.example"
            exit 1
          fi
          echo "✓ No .env files found"
      
      - name: Check for .env references in code
        run: |
          echo "Checking for hardcoded .env references..."
          # Check for require('.env') or import '.env' patterns
          if grep -r "require.*['\"]\.env['\"]" --include="*.js" --include="*.ts" --include="*.mjs" . 2>/dev/null | grep -v node_modules | grep -v ".github/workflows"; then
            echo "❌ ERROR: Found hardcoded .env require() statements!"
            exit 1
          fi
          if grep -r "from.*['\"]\.env['\"]" --include="*.js" --include="*.ts" --include="*.mjs" . 2>/dev/null | grep -v node_modules | grep -v ".github/workflows"; then
            echo "❌ ERROR: Found hardcoded .env import statements!"
            exit 1
          fi
          echo "✓ No hardcoded .env references found"
      
      - name: Success
        run: echo "✓ All secret hygiene checks passed"
